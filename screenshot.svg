<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Header -->
  <text x="400" y="42" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="0.5">
    currency_field_formatter
  </text>
  <text x="400" y="66" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    Bulletproof Flutter Currency Formatter · Zero Cursor Jumping · Indian Lakhs &amp; Crores
  </text>

  <!-- Left: Interactive Formatter Inputs -->
  <g transform="translate(50, 90)">
    <rect width="330" height="275" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />

    <!-- USD Field -->
    <g transform="translate(20, 20)">
      <text x="0" y="14" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">US DOLLAR (USD)</text>
      <rect y="22" width="290" height="46" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
      <text x="14" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="18" font-weight="bold">$ 1,250.00</text>
      <line x1="120" y1="34" x2="120" y2="56" stroke="#38BDF8" stroke-width="2" />
    </g>

    <!-- INR Field (Indian Lakhs/Crores) -->
    <g transform="translate(20, 100)">
      <text x="0" y="14" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">INDIAN RUPEE (INR - LAKHS/CRORES)</text>
      <rect y="22" width="290" height="46" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="14" y="52" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="18" font-weight="bold">₹ 15,50,000</text>
    </g>

    <!-- Values Extractor Card -->
    <g transform="translate(20, 185)">
      <rect width="290" height="68" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1" />
      
      <g transform="translate(15, 18)">
        <text x="0" y="10" fill="#64748B" font-size="10" font-weight="bold">numericValue</text>
        <text x="0" y="28" fill="#38BDF8" font-size="13" font-weight="bold">1250.0</text>
      </g>

      <g transform="translate(110, 18)">
        <text x="0" y="10" fill="#64748B" font-size="10" font-weight="bold">integerCents</text>
        <text x="0" y="28" fill="#34D399" font-size="13" font-weight="bold">125000</text>
      </g>

      <g transform="translate(205, 18)">
        <text x="0" y="10" fill="#64748B" font-size="10" font-weight="bold">toIsoString</text>
        <text x="0" y="28" fill="#FBBF24" font-size="13" font-weight="bold">"1250.00"</text>
      </g>
    </g>
  </g>

  <!-- Right: Technical Capabilities -->
  <g transform="translate(415, 90)">
    <rect width="335" height="275" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />

    <text x="24" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">
      Key Technical Advantages
    </text>

    <!-- Point 1 -->
    <g transform="translate(24, 52)">
      <circle cx="12" cy="16" r="10" fill="#38BDF8" fill-opacity="0.2" />
      <text x="12" y="20" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="bold">🎯</text>
      <text x="32" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">
        Exact Cursor Tracking
      </text>
      <text x="32" y="28" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">
        Editing mid-number never throws the cursor to the end
      </text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(24, 102)">
      <circle cx="12" cy="16" r="10" fill="#34D399" fill-opacity="0.2" />
      <text x="12" y="20" text-anchor="middle" fill="#34D399" font-size="11" font-weight="bold">⌫</text>
      <text x="32" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">
        Clean Separator Backspacing
      </text>
      <text x="32" y="28" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">
        Deleting commas/periods removes preceding digit cleanly
      </text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(24, 152)">
      <circle cx="12" cy="16" r="10" fill="#FBBF24" fill-opacity="0.2" />
      <text x="12" y="20" text-anchor="middle" fill="#FBBF24" font-size="11" font-weight="bold">🌏</text>
      <text x="32" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">
        Indian Lakhs &amp; Crores (3, 2, 2)
      </text>
      <text x="32" y="28" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">
        Native South Asian numbering support out-of-the-box
      </text>
    </g>

    <!-- Point 4 -->
    <g transform="translate(24, 202)">
      <circle cx="12" cy="16" r="10" fill="#A855F7" fill-opacity="0.2" />
      <text x="12" y="20" text-anchor="middle" fill="#C084FC" font-size="11" font-weight="bold">💳</text>
      <text x="32" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">
        Direct Gateway Cents Output
      </text>
      <text x="32" y="28" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">
        Zero floating-point rounding errors for Stripe/Razorpay
      </text>
    </g>
  </g>
</svg>
